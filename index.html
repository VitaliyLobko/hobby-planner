<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121417">
  <!-- Дані йдуть лише у власний бот на workers.dev, коли його підключено; решту браузер блокує. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="description" content="План хобі на день: ранок, обід, вечір — і звичка не пропускати">
  <title>Хобі-план</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Тема — до стилів, щоб світла тема не блимала темною при старті -->
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Хобі-план</h1>
    <a href="#settings" class="icon-btn" aria-label="Налаштування">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6"/><path d="M19 12h2.6M16.95 16.95l1.84 1.84M12 19v2.6M7.05 16.95l-1.84 1.84M5 12H2.4M7.05 7.05L5.21 5.21M12 5V2.4M16.95 7.05l1.84-1.84"/></svg>
    </a>
  </header>

  <div id="update" class="update" hidden>
    <span>Доступна нова версія</span>
    <button type="button" id="update-btn">Оновити</button>
  </div>

  <main id="view" class="view"></main>

  <button type="button" id="fab" class="fab" aria-label="Нове заняття" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs" aria-label="Розділи">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      <span>Сьогодні</span>
    </a>
    <a href="#plan" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>План</span>
    </a>
    <a href="#week" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>
      <span>Тиждень</span>
    </a>
    <a href="#acts" data-tab="acts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      <span>Заняття</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="layer"></div>
</body>
</html>
